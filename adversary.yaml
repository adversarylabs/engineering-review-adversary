name: review/engineering
version: 0.0.33
description: Reviews proposed changes with Staff-level engineering judgment across languages.

triggers:
  manual: true
  files_changed:
    - "*.go"
    - "**/*.go"
    - "*.ts"
    - "**/*.ts"
    - "*.tsx"
    - "**/*.tsx"
    - "*.js"
    - "**/*.js"
    - "*.jsx"
    - "**/*.jsx"
    - "*.py"
    - "**/*.py"
    - "*.rs"
    - "**/*.rs"
    - "*.java"
    - "**/*.java"
    - "*.cs"
    - "**/*.cs"
    - "*.kt"
    - "**/*.kt"
    - "*.kts"
    - "**/*.kts"
    - "*.sh"
    - "**/*.sh"
    - "*.bash"
    - "**/*.bash"
    - "*.mk"
    - "**/*.mk"
    - "Makefile"
    - "**/Makefile"
    - "GNUmakefile"
    - "**/GNUmakefile"
    - "*.md"
    - "**/*.md"
    - "charts/**/templates/*.yml"
    - "charts/**/templates/*.yaml"
    - "charts/**/templates/**/*.yml"
    - "charts/**/templates/**/*.yaml"
    - "**/charts/**/templates/*.yml"
    - "**/charts/**/templates/*.yaml"
    - "**/charts/**/templates/**/*.yml"
    - "**/charts/**/templates/**/*.yaml"
    - "**/integration/**/00-setup"
    - "**/integration/**/01-start-server"
    - "**/integration/**/02-bootstrap-agent"
    - "**/integration/**/03-start-agent"
    - "**/integration/**/04-submit-job"
    - "**/integration/**/05-create-entry"
    - "**/integration/**/06-verify-fetch"
    - "**/integration/**/teardown"

detection:
  files:
    - "*.go"
    - "**/*.go"
    - "*.ts"
    - "**/*.ts"
    - "*.tsx"
    - "**/*.tsx"
    - "*.js"
    - "**/*.js"
    - "*.jsx"
    - "**/*.jsx"
    - "*.py"
    - "**/*.py"
    - "*.rs"
    - "**/*.rs"
    - "*.java"
    - "**/*.java"
    - "*.cs"
    - "**/*.cs"
    - "*.kt"
    - "**/*.kt"
    - "*.kts"
    - "**/*.kts"
    - "*.sh"
    - "**/*.sh"
    - "*.bash"
    - "**/*.bash"
    - "*.mk"
    - "**/*.mk"
    - "Makefile"
    - "**/Makefile"
    - "GNUmakefile"
    - "**/GNUmakefile"
    - "*.md"
    - "**/*.md"
    - "charts/**/templates/*.yml"
    - "charts/**/templates/*.yaml"
    - "charts/**/templates/**/*.yml"
    - "charts/**/templates/**/*.yaml"
    - "**/charts/**/templates/*.yml"
    - "**/charts/**/templates/*.yaml"
    - "**/charts/**/templates/**/*.yml"
    - "**/charts/**/templates/**/*.yaml"
    - "**/integration/**/00-setup"
    - "**/integration/**/01-start-server"
    - "**/integration/**/02-bootstrap-agent"
    - "**/integration/**/03-start-agent"
    - "**/integration/**/04-submit-job"
    - "**/integration/**/05-create-entry"
    - "**/integration/**/06-verify-fetch"
    - "**/integration/**/teardown"

runtime:
  name: node
  version: "22"
  command:
    - dist/index.js

permissions:
  enforcement: advisory
  filesystem:
    read:
      - .
    write: []
  network: false
  model: true
  environment:
    allow: []

findings:
  format: adversary.review.v1
